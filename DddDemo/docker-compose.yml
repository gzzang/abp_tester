version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ddddemo-postgres
    environment:
      POSTGRES_USER: gzzang
      POSTGRES_PASSWORD: zz123123
      POSTGRES_DB: DddDemo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ddddemo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gzzang -d DddDemo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ddddemo-redis
    ports:
      - "6379:6379"
    networks:
      - ddddemo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  ddddemo-network:
    driver: bridge
