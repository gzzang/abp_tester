services:
  postgres:
    image: postgres:16-alpine
    container_name: ddddemo-postgres
    environment:
      POSTGRES_USER: gzzang
      POSTGRES_PASSWORD: zz123123
      POSTGRES_DB: DddDemo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ddddemo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gzzang -d DddDemo"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ddddemo-web:latest
    build:
      context: ./aspnet-core
      dockerfile: src/DddDemo.HttpApi.Host/Dockerfile
    container_name: ddddemo-web
    depends_on:
      - postgres
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - AbpMvcLibs__CheckLibs=false
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=DddDemo;User ID=gzzang;Password=zz123123;
    ports:
      - "5000:5000"
    volumes:
      - ./aspnet-core/src/DddDemo.HttpApi.Host/wwwroot/libs:/app/wwwroot/libs
    networks:
      - ddddemo-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ddddemo-redis
    ports:
      - "6379:6379"
    networks:
      - ddddemo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  ddddemo-network:
    driver: bridge
